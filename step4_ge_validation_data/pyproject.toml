[project]
name = "mlops-step4"
version = "0.1.0"
description = "mlops prac"
authors = [
    {name = "ega"}
]
readme = "README.md"
requires-python = ">=3.9.6,<4.0.0"
dependencies = [
    "pandas (>=2.2,<3.0)",
    "scikit-learn (>=1.5,<2.0)",
    "dvc (>=3.50,<4.0)",
    "great-expectations (>=0.18,<0.19)",
    "pyyaml (>=6.0,<7.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "black (>=24.0,<25.0)",
    "ruff (>=0.6,<0.7)",
    "isort (>=5.13,<6.0)",
    "pre-commit (>=3.7,<4.0)"
]
